<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediBill RMV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        background: #172137;
        color: #ffffff;
        width: 320px;
        min-height: 120px;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 20px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        gap: 4px;
      }
      .monogram {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.22em;
        line-height: 1;
        user-select: none;
      }
      .subtitle {
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.16em;
        color: rgba(255,255,255,0.38);
        text-transform: uppercase;
      }

      /* ── Queue section ── */
      #queue-section { display: none; }

      .queue-header {
        padding: 12px 14px 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.45);
      }

      #patient-list {
        list-style: none;
        max-height: 240px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.18) transparent;
      }
      #patient-list::-webkit-scrollbar { width: 4px; }
      #patient-list::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.18);
        border-radius: 2px;
      }

      /* ── Empty state ── */
      #empty-state {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 32px 24px;
        gap: 10px;
        text-align: center;
      }
      .empty-icon {
        width: 40px;
        height: 40px;
        opacity: 0.25;
      }
      .empty-title {
        font-size: 14px;
        font-weight: 500;
        color: rgba(255,255,255,0.65);
        line-height: 1.4;
      }
      .empty-hint {
        font-size: 12px;
        color: rgba(255,255,255,0.3);
        line-height: 1.6;
        max-width: 220px;
      }

      /* ── Footer / actions ── */
      #footer {
        display: none;
        flex-direction: column;
        gap: 8px;
        padding: 12px 14px 16px;
        border-top: 1px solid rgba(255,255,255,0.1);
      }

      /* Primary CTA */
      #btn-go {
        width: 100%;
        padding: 13px 16px;
        min-height: 48px;
        background: #ffffff;
        color: #172137;
        border: none;
        border-radius: 10px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      #btn-go:hover   { transform: scale(1.01); box-shadow: 0 2px 12px rgba(0,0,0,0.22); }
      #btn-go:active  { transform: scale(0.98); }
      #btn-go:focus-visible {
        outline: 3px solid rgba(255,255,255,0.6);
        outline-offset: 2px;
      }

      /* Destructive ghost */
      #btn-clear {
        width: 100%;
        padding: 10px 16px;
        min-height: 40px;
        background: none;
        color: rgba(255,255,255,0.42);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 400;
        cursor: pointer;
        transition: color 150ms ease, border-color 150ms ease, transform 120ms ease;
      }
      #btn-clear:hover  { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.3); }
      #btn-clear:active { transform: scale(0.98); }
      #btn-clear:focus-visible {
        outline: 2px solid rgba(255,255,255,0.4);
        outline-offset: 2px;
      }

      /* ── Confirm row ── */
      #confirm-clear {
        display: none;
        align-items: center;
        gap: 8px;
      }
      .confirm-label {
        font-size: 12px;
        color: rgba(255,255,255,0.5);
        flex: 1;
        line-height: 1.4;
      }
      .btn-confirm-yes, .btn-confirm-no {
        padding: 8px 14px;
        min-height: 36px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: transform 100ms ease;
        flex-shrink: 0;
        border: none;
      }
      .btn-confirm-yes:active, .btn-confirm-no:active { transform: scale(0.96); }
      #btn-confirm-yes {
        background: rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.7);
      }
      #btn-confirm-yes:hover { background: rgba(255,255,255,0.18); }
      #btn-confirm-no {
        background: #ffffff;
        color: #172137;
      }
      #btn-confirm-no:hover { opacity: 0.92; }
      .btn-confirm-yes:focus-visible, .btn-confirm-no:focus-visible {
        outline: 2px solid rgba(255,255,255,0.5);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>

    <!-- Header -->
    <header class="header" role="banner">
      <span class="monogram" aria-label="Iniciales: R M V">RMV</span>
      <span class="subtitle">MediBill — Emisión</span>
    </header>

    <!-- Queue section (visible when patients exist) -->
    <section id="queue-section" aria-label="Cola de pacientes">
      <p class="queue-header" id="queue-count" aria-live="polite">0 pacientes en cola</p>
      <ul id="patient-list" role="list" aria-label="Lista de pacientes pendientes"></ul>
    </section>

    <!-- Empty state -->
    <div id="empty-state" role="status" aria-label="Sin pacientes pendientes">
      <svg class="empty-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="18" stroke="white" stroke-width="1.8"/>
        <path d="M13 20h14M20 13v14" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <p class="empty-title">Sin pacientes pendientes</p>
      <p class="empty-hint">Aprueba un paciente en MediBill y toca "Enviar a emisión".</p>
    </div>

    <!-- Footer actions -->
    <footer id="footer" role="contentinfo">
      <button id="btn-go" type="button" aria-label="Abrir formulario de cliente en e-Misión">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Ir a e-Misión
      </button>

      <!-- Normal clear button -->
      <button id="btn-clear" type="button">Limpiar cola</button>

      <!-- Inline confirmation (hidden until Limpiar is clicked) -->
      <div id="confirm-clear" role="group" aria-label="Confirmar limpieza de cola">
        <span class="confirm-label">¿Limpiar todos los pacientes?</span>
        <button id="btn-confirm-yes" class="btn-confirm-yes" type="button">Sí, limpiar</button>
        <button id="btn-confirm-no"  class="btn-confirm-no"  type="button">Cancelar</button>
      </div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
